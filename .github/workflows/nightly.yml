name: Nightly Build
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Build type to run
        type: choice
        required: true
        default: both
        options:
          - both
          - daily
          - candidate
  schedule:
    - cron: "0 4 * * *" # 4AM UTC / 08PM PST / 09PM PDT

jobs:
  select-builds:
    name: Select build types
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          RELEASE_TYPE: ${{ inputs.release_type || 'both' }}
        run: |
          matrix=$(jq -cn --arg type "$RELEASE_TYPE" '{
            include: [
              {branch: "release/v1.13", release_type: "candidate"},
              {branch: "develop", release_type: "daily"}
            ] | map(select($type == "both" or .release_type == $type))
          }')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build-linux-bundles:
    name: Build shared Linux bundles
    needs: [select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/linux_bundles_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-rocky9-docker:
    name: Build ChimeraX for Rocky 9
    needs: [select-builds, build-linux-bundles]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/rocky9_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-rocky10-docker:
    name: Build ChimeraX for Rocky 10
    needs: [select-builds, build-linux-bundles]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/rocky10_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-ubuntu:
    name: Build ChimeraX for Ubuntu
    needs: [select-builds, build-linux-bundles]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/ubuntu_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-docker:
    name: Build ChimeraX Docker image
    needs: [select-builds, build-linux-bundles]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/docker_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-flatpak:
    name: Build ChimeraX FlatPak
    needs: [select-builds, build-linux-bundles]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/flatpak_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-docker-arm:
    name: Build ARM ChimeraX Docker image
    needs: [select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/docker_arm_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  docker-manifest:
    name: Create multi-arch Docker manifest
    needs: [select-builds, build-docker, build-docker-arm]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/docker_manifest.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-flatpak-arm:
    name: Build ARM ChimeraX FlatPak
    needs: [select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/flatpak_arm_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-arm-macos:
    name: Build ChimeraX for arm64 macOS
    needs: [select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/mac_arm_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-intel-macos:
    name: Build ChimeraX for Intel macOS
    needs: [select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/mac_intel_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-mac-universal:
    name: Build Universal ChimeraX for macOS
    needs: [select-builds, build-arm-macos, build-intel-macos]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/mac_universal_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
  build-windows:
    name: Build ChimeraX for Windows
    needs: [select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}
    uses: ./.github/workflows/windows_build.yml
    with:
      branch: ${{ matrix.branch }}
      release_type: ${{ matrix.release_type }}
    secrets: inherit
