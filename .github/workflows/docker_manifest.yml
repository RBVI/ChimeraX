name: Create multi-arch Docker manifest
on:
  workflow_call:
    inputs:
      release_type:
        type: string
        required: true
      branch:
        type: string
        required: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  create-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || 'develop' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Put the commit and version in the environment
        run: |
          export COMMIT_HASH=$(git rev-parse --short HEAD)
          export BUILD_VERSION=$(cat src/bundles/core/Makefile | grep VERSION | head -n 1 | cut -d'=' -f2 | sed -e 's/ //g')
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
      - name: Create and push multi-arch manifests
        run: |
          REPO=docker.io/ucsfrbvi/chimerax
          case "${{ inputs.release_type }}" in
            daily|techpreview)
              docker buildx imagetools create -t ${REPO}:${{ inputs.release_type }} \
                ${REPO}:${{ inputs.release_type }}-amd64 \
                ${REPO}:${{ inputs.release_type }}-arm64

              docker buildx imagetools create -t ${REPO}:${{ inputs.release_type }}-${COMMIT_HASH} \
                ${REPO}:${{ inputs.release_type }}-amd64-${COMMIT_HASH} \
                ${REPO}:${{ inputs.release_type }}-arm64-${COMMIT_HASH}
              ;;
            candidate)
              docker buildx imagetools create -t ${REPO}:${BUILD_VERSION}-rc \
                ${REPO}:${BUILD_VERSION}-rc-amd64 \
                ${REPO}:${BUILD_VERSION}-rc-arm64

              docker buildx imagetools create -t ${REPO}:${BUILD_VERSION}-rc-${COMMIT_HASH} \
                ${REPO}:${BUILD_VERSION}-rc-amd64-${COMMIT_HASH} \
                ${REPO}:${BUILD_VERSION}-rc-arm64-${COMMIT_HASH}
              ;;
            production)
              docker buildx imagetools create -t ${REPO}:${BUILD_VERSION} \
                ${REPO}:${BUILD_VERSION}-amd64 \
                ${REPO}:${BUILD_VERSION}-arm64

              docker buildx imagetools create -t ${REPO}:${BUILD_VERSION}-${COMMIT_HASH} \
                ${REPO}:${BUILD_VERSION}-amd64-${COMMIT_HASH} \
                ${REPO}:${BUILD_VERSION}-arm64-${COMMIT_HASH}

              docker buildx imagetools create -t ${REPO}:latest \
                ${REPO}:latest-amd64 \
                ${REPO}:latest-arm64
              ;;
            *)
              echo "Unknown release_type: ${{ inputs.release_type }}" >&2
              exit 1
              ;;
          esac
