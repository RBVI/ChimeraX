name: Release
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        required: true
        default: all
        options:
          - all
          - windows
          - mac-arm
          - mac-intel
          - mac-universal
          - ubuntu
          - rocky9
          - rocky10
          - flatpak
          - flatpak-arm
          - docker

jobs:
  build-linux-bundles:
    name: Build shared Linux bundles
    if: ${{ contains(' all ubuntu rocky9 rocky10 flatpak docker ', format(' {0} ', inputs.platform || 'all')) }}
    uses: ./.github/workflows/linux_bundles_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-rocky9-docker:
    name: Build ChimeraX for Rocky 9
    if: ${{ contains(' all rocky9 ', format(' {0} ', inputs.platform || 'all')) }}
    needs: [build-linux-bundles]
    uses: ./.github/workflows/rocky9_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-rocky10-docker:
    name: Build ChimeraX for Rocky 10
    if: ${{ contains(' all rocky10 ', format(' {0} ', inputs.platform || 'all')) }}
    needs: [build-linux-bundles]
    uses: ./.github/workflows/rocky10_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-ubuntu:
    name: Build ChimeraX for Ubuntu
    if: ${{ contains(' all ubuntu ', format(' {0} ', inputs.platform || 'all')) }}
    needs: [build-linux-bundles]
    uses: ./.github/workflows/ubuntu_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-docker:
    name: Build ChimeraX Docker image
    if: ${{ contains(' all docker ', format(' {0} ', inputs.platform || 'all')) }}
    needs: [build-linux-bundles]
    uses: ./.github/workflows/docker_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-docker-arm:
    name: Build ARM ChimeraX Docker image
    if: ${{ contains(' all docker ', format(' {0} ', inputs.platform || 'all')) }}
    uses: ./.github/workflows/docker_arm_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  docker-manifest:
    name: Create multi-arch Docker manifest
    if: ${{ contains(' all docker ', format(' {0} ', inputs.platform || 'all')) }}
    needs: [build-docker, build-docker-arm]
    uses: ./.github/workflows/docker_manifest.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-flatpak:
    name: Build ChimeraX FlatPak
    if: ${{ contains(' all flatpak ', format(' {0} ', inputs.platform || 'all')) }}
    needs: [build-linux-bundles]
    uses: ./.github/workflows/flatpak_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-flatpak-arm:
    name: Build ARM ChimeraX FlatPak
    if: ${{ contains(' all flatpak-arm ', format(' {0} ', inputs.platform || 'all')) }}
    uses: ./.github/workflows/flatpak_arm_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-arm-macos:
    name: Build ChimeraX for arm64 macOS
    if: ${{ contains(' all mac-arm mac-universal ', format(' {0} ', inputs.platform || 'all')) }}
    uses: ./.github/workflows/mac_arm_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-intel-macos:
    name: Build ChimeraX for Intel macOS
    if: ${{ contains(' all mac-intel mac-universal ', format(' {0} ', inputs.platform || 'all')) }}
    uses: ./.github/workflows/mac_intel_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-mac-universal:
    name: Build Universal ChimeraX for macOS
    if: ${{ contains(' all mac-universal ', format(' {0} ', inputs.platform || 'all')) }}
    needs: [build-arm-macos, build-intel-macos]
    uses: ./.github/workflows/mac_universal_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
  build-windows:
    name: Build ChimeraX for Windows
    if: ${{ contains(' all windows ', format(' {0} ', inputs.platform || 'all')) }}
    uses: ./.github/workflows/windows_build.yml
    with:
      branch: master
      release_type: production
    secrets: inherit
