name: Rebuild on change

on:
  pull_request:
    branches: [develop, release/*]
  push:
    branches: [develop, release/*]
    paths-ignore: [.github/workflows/nightly.yml, .github/workflows/*build.yml]

# See https://stackoverflow.com/a/72408109
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build the bundles without starting ChimeraX (see src/bundles/Makefile.bundle)
  NO_DOGFOODING: "1"

jobs:
  build-and-test-rocky9-docker:
    runs-on: ubuntu-22.04
    container:
      image: rockylinux:9
    env:
      SHELL: /bin/bash
      PATH: /usr/bin:/usr/sbin:/bin:/sbin
    steps:
      - run: export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
      # Mirror speed varies wildly between runs; download in parallel from the
      # fastest mirror. set_up_centos.sh already runs dnf update, so don't do it
      # twice, and git-all drags in Perl, Tk and Subversion that we don't need.
      - name: Configure dnf and install git
        run: |
          printf 'max_parallel_downloads=10\nfastestmirror=True\ninstall_weak_deps=False\n' >> /etc/dnf/dnf.conf
          dnf install -y git
      - uses: actions/checkout@v7
      # buildinfo.py breaks without this
      - run: chown -R $(id -u):$(id -g) $PWD
      - run: ${PWD}/utils/set_up_centos.sh
      - name: Fetch Plato prerequisites
        uses: ./utils/ci/consolidated_cache
        with:
          platform: linux
          architecture: x86_64
          cache_key: ${{ secrets.PREBUILT_CACHE_SECRET }}
      - run: MAKEOPTS="-j$(nproc)" make -j$(nproc) -f Makefile.centos build-minimal
      - name: Install Pytest
        run: USE_COVERAGE=1 make pytest-install
      - name: Set up the repo for coverage reporting
        run: make prepare-coverage
      - name: Check whether ChimeraX.exe and python -m chimerax.core are equivalent
        run: USE_COVERAGE=1 make pytest-both-exes
      - name: Run distribution tests
        run: USE_COVERAGE=1 make pytest-app
      - name: Report coverage
        run: make report-coverage
  build-and-test-arm-linux:
    runs-on: ubuntu-24.04-arm
    env:
      SHELL: /bin/bash
      PATH: /usr/bin:/usr/sbin:/bin:/sbin
      PYOPENGL_PLATFORM: egl
    container:
      image: fedora:latest
      options: --privileged
    steps:
      - name: Update system packages
        run: |
          dnf update -y
          dnf install -y dbus-daemon flatpak flatpak-builder git-lfs python3-aiohttp python3-tenacity python3-gobject xorg-x11-server-Xvfb ccache zstd libappstream-glib
          dnf clean all
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --if-not-exists flathub-beta https://flathub.org/beta-repo/flathub-beta.flatpakrepo
          flatpak install -y flathub org.flatpak.Builder
          flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - uses: actions/checkout@v7
      - name: Fetch Plato prerequisites
        uses: ./utils/ci/consolidated_cache
        with:
          platform: linux
          architecture: arm64
          cache_native_python: 'false'
          cache_key: ${{ secrets.PREBUILT_CACHE_SECRET }}
      # flatpak-builder runs the test suite inside a bwrap sandbox that does not
      # inherit this runner's CI/GITHUB_ACTIONS variables, so the test suite's
      # _in_ci() check would otherwise miss. Inject CI here rather than in the
      # committed manifest so that local flatpak builds are unaffected.
      - name: Mark the CI environment in the Flatpak manifest
        run: sed -i -e 's/\(USE_COVERAGE=1 make pytest\)/CI=1 \1/' arm-flatpak.yml
      # The release manifest does a full install-rbvi (docs, vdocs, compileall)
      # and runs the wheel tests too. For change checks, do what the other
      # platforms do: build-minimal, then the app tests.
      - name: Trim the Flatpak manifest down to a minimal build
        run: |
          sed -i -e 's/make -j$(nproc) install-rbvi/make -j$(nproc) build-minimal/' \
                 -e '/make pytest-wheel/d' arm-flatpak.yml
          grep -q 'build-minimal' arm-flatpak.yml
      # Stopping before krb5 (which only follows the chimerax module so that it can
      # land in PySide6's lib dir) also skips exporting and bundling the Flatpak,
      # which a change check has no use for.
      - name: Build ChimeraX
        uses: flatpak/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: arm-flatpak.yml
          arch: aarch64
          cache-key: flatpak-builder-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          stop-at-module: krb5
          upload-artifact: false
  build-and-test-macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
      - uses: actions/checkout@v7
      - run: ${PWD}/utils/set_up_macos.sh
      - name: Fetch Plato prerequisites
        uses: ./utils/ci/consolidated_cache
        with:
          platform: macos
          architecture: arm64
          cache_key: ${{ secrets.PREBUILT_CACHE_SECRET }}
      - name: Install the 3DConnexion Framework
        run: |
          hdiutil attach 3DxWareMac_v10-8-7_r3836.dmg -nobrowse -noverify -quiet
          sudo installer -pkg /Volumes/3Dconnexion\ Software/Install\ 3Dconnexion\ software.pkg -target /
          hdiutil detach /Volumes/3Dconnexion\ Software
      - run: MAKEOPTS="-j$(sysctl -n hw.logicalcpu)" make -j$(sysctl -n hw.logicalcpu) build-minimal
      - name: Install Pytest
        run: USE_COVERAGE=1 make pytest-install
      - name: Set up the repo for coverage reporting
        run: make prepare-coverage
      - name: Check whether ChimeraX.exe and python -m chimerax.core are equivalent
        run: USE_COVERAGE=1 make pytest-both-exes
      - name: Run distribution tests
        run: USE_COVERAGE=1 make pytest-app
      - name: Report coverage
        run: make report-coverage
  build-and-test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gcc-objc mingw-w64-ucrt-x86_64-gcc-fortran rsync patch unzip openssh make mingw-w64-ucrt-x86_64-autotools
      - name: Fetch Plato prerequisites
        uses: ./utils/ci/consolidated_cache
        with:
          platform: windows
          architecture: x86_64
          cache_key: ${{ secrets.PREBUILT_CACHE_SECRET }}
      - run: AUTOMATIC_DISCOVERY=1 . ./vsvars.sh && MAKEOPTS="-j$(nproc)" make -j$(nproc) build-minimal
      - name: Install Pytest
        run: USE_COVERAGE=1 make pytest-install
      - name: Set up the repo for coverage reporting
        run: make prepare-coverage
      - name: Check whether ChimeraX.exe and python -m chimerax.core are equivalent
        run: USE_COVERAGE=1 make pytest-both-exes
      - name: Run distribution tests
        run: USE_COVERAGE=1 make pytest-app
      - name: Report coverage
        run: make report-coverage
