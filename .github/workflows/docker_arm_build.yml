name: Build ChimeraX ARM Docker image
on:
  workflow_call:
    inputs:
      release_type:
        type: string
        required: true
      branch:
        type: string
        required: false
    secrets:
      PREBUILT_CACHE_SECRET:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-docker-arm:
    runs-on: ubuntu-24.04-arm
    env:
      PYOPENGL_PLATFORM: egl
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || 'develop' }}
      - run: sudo apt-get update && sudo apt-get upgrade -y && ${PWD}/utils/set_up_ubuntu.sh
      - name: Fetch Plato prerequisites
        uses: ./utils/ci/consolidated_cache
        with:
          platform: linux
          architecture: arm64
          cache_key: ${{ secrets.PREBUILT_CACHE_SECRET }}
      - name: Build ChimeraX.app
        run: |
          MAKEOPTS="-j$(nproc)" NO_PREBUILT=1 BUILD_TYPE="${{ inputs.release_type }}" PYQT_LICENSE=commercial make -j$(nproc) install-rbvi
          make dockerize
      - name: Put the build date, commit, and version in the environment
        run: |
          export COMMIT_HASH=$(git rev-parse --short HEAD)
          export COMMIT_DATE=$(git log -1 --pretty='format:%cD' HEAD)
          export BUILD_VERSION=$(cat src/bundles/core/Makefile | grep VERSION | head -n 1 | cut -d'=' -f2 | sed -e 's/ //g')
          echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          REPO=docker.io/ucsfrbvi/chimerax
          case "${{ inputs.release_type }}" in
            daily|techpreview)
              # Rolling channel tags: chimerax:daily-arm64, chimerax:daily-arm64-abc1234
              TAGS="${REPO}:${{ inputs.release_type }}-arm64,${REPO}:${{ inputs.release_type }}-arm64-${COMMIT_HASH}"
              ;;
            candidate)
              # Release candidate: chimerax:1.12-rc-arm64, chimerax:1.12-rc-arm64-abc1234
              TAGS="${REPO}:${BUILD_VERSION}-rc-arm64,${REPO}:${BUILD_VERSION}-rc-arm64-${COMMIT_HASH}"
              ;;
            production)
              # Production: chimerax:1.12-arm64, chimerax:1.12-arm64-abc1234, chimerax:latest-arm64
              TAGS="${REPO}:${BUILD_VERSION}-arm64,${REPO}:${BUILD_VERSION}-arm64-${COMMIT_HASH},${REPO}:latest-arm64"
              ;;
            *)
              echo "Unknown release_type: ${{ inputs.release_type }}" >&2
              exit 1
              ;;
          esac
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ env.COMMIT_DATE }}
