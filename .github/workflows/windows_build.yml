name: Build ChimeraX for Windows
on:
  workflow_call:
    inputs:
      release_type:
        type: string
        required: true
      branch:
        type: string
        required: false
    secrets:
      PREBUILT_CACHE_SECRET:
        required: true
      WINDOWS_SIGNING_CERT:
        required: true
      WINDOWS_SIGNING_PASS:
        required: true

env:
  # Build the bundles without starting ChimeraX (see src/bundles/Makefile.bundle)
  NO_DOGFOODING: "1"

jobs:
  build-windows:
    # synchronize with the Visual C++ runtime bundled in chimerax.iss.in
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || 'develop' }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gcc-objc mingw-w64-ucrt-x86_64-gcc-fortran rsync patch unzip openssh make mingw-w64-ucrt-x86_64-autotools
      - name: Fetch Plato prerequisites
        uses: ./utils/ci/consolidated_cache
        with:
          platform: windows
          architecture: x86_64
          cache_key: ${{ secrets.PREBUILT_CACHE_SECRET }}
      - uses: Tiryoh/gha-jobid-action@v1
        id: get_job_id
        if: ${{ inputs.release_type == 'daily' || inputs.release_type == 'candidate' }}
        with:
          job_name: ${{ format('Build ChimeraX for Windows ({0}, {1}) / build-windows', inputs.branch, inputs.release_type) }}
          per_page: 100
      - name: Note the run and job IDs on Plato
        if: ${{ inputs.release_type == 'daily' || inputs.release_type == 'candidate' }}
        uses: nick-fields/retry@v4
        with:
          # You're gonna do it until you succeed, <REDACTED>! I'm not watching one more build fail because
          # GitHub Actions couldn't contact Plato.
          max_attempts: 1000
          timeout_seconds: 60
          shell: bash
          command: ./utils/ci/nightly_logs.sh ${{ secrets.PREBUILT_CACHE_SECRET }} ${{ github.run_id }} ${{ steps.get_job_id.outputs.job_id }} windows ${{ inputs.release_type }}
      - run: AUTOMATIC_DISCOVERY=1 . ./vsvars.sh && MAKEOPTS="-j$(nproc)" BUILD_TYPE="${{ inputs.release_type }}" make -j$(nproc) install-rbvi
      - name: Install Pytest
        run: ./ChimeraX.app/bin/python.exe -I -m pip install pytest pytest-cov
      - name: Set up the repo for coverage reporting
        run: make prepare-coverage
      # Failing tests only stop candidate and production builds
      - name: Check whether ChimeraX.exe and python -m chimerax.core are equivalent
        continue-on-error: ${{ inputs.release_type == 'daily' || inputs.release_type == 'techpreview' }}
        id: test-exes
        run: USE_COVERAGE=1 make pytest-both-exes
      - name: Run distribution tests
        continue-on-error: ${{ inputs.release_type == 'daily' || inputs.release_type == 'techpreview' }}
        id: test-distribution
        run: USE_COVERAGE=1 make pytest-app
      - name: Report coverage
        run: make report-coverage
      - name: Put the test outcome in the environment
        if: ${{ inputs.release_type == 'daily' || inputs.release_type == 'candidate' }}
        run: |
          if [ "${{ steps.test-exes.outcome }}" = "failure" ] || [ "${{ steps.test-distribution.outcome }}" = "failure" ]; then
            echo "TEST_OUTCOME=Failing" >> $GITHUB_ENV
          else
            echo "TEST_OUTCOME=Passing" >> $GITHUB_ENV
          fi
      - name: Report test results to Plato
        if: ${{ inputs.release_type == 'daily' || inputs.release_type == 'candidate' }}
        uses: nick-fields/retry@v4
        with:
          max_attempts: 1000
          timeout_minutes: 60
          shell: bash
          command: curl -v -F "key=${{ secrets.PREBUILT_CACHE_SECRET }}" -F "platform=windows" -F "build_type=${{ inputs.release_type }}" -F "outcome=$TEST_OUTCOME" https://rbvi.ucsf.edu/chimerax/cgi-bin/confirm_tests.py
      - name: Copy scripts into the package
        run: |
          cp utils/build/windows/remove_pycache.py ChimeraX.app/bin/
      - name: Put the build date and commit in the environment
        shell: bash
        run: |
          export COMMIT_HASH=$(git rev-parse --short HEAD)
          export COMMIT_DATE=$(git log -1 --pretty='format:%cD' HEAD)
          echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
      - name: Put release version in the environment (candidate)
        if: ${{ inputs.release_type == 'candidate' }}
        shell: bash
        run: |
          export BUILD_VERSION=$(echo ${{ inputs.branch }} | sed -e 's/.*v//g')
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
      - name: Put release version in the environment (production)
        if: ${{ inputs.release_type == 'production' }}
        shell: bash
        run: |
          export BUILD_VERSION=$(cat src/bundles/core/Makefile | grep VERSION | head -n 1 | cut -d'=' -f2 | sed -e 's/ //g')
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
      - name: Build tarball
        run: tar zcf ChimeraX.tar.gz ChimeraX.app
      - name: Upload ChimeraX (Daily or Tech Preview)
        if: ${{ inputs.release_type == 'daily' || inputs.release_type == 'techpreview' }}
        uses: nick-fields/retry@v4
        with:
          # You're gonna do it until you succeed, <REDACTED>! I'm not watching one more build fail because
          # GitHub Actions couldn't contact Plato.
          max_attempts: 1000
          timeout_minutes: 60
          shell: bash
          command: curl -v -F "key=${{ secrets.PREBUILT_CACHE_SECRET }}" -F "commit=$COMMIT_HASH" -F "date=$COMMIT_DATE" -F "platform=windows" -F "build_type=${{ inputs.release_type }}" -F "file=@$GITHUB_WORKSPACE/ChimeraX.tar.gz" https://rbvi.ucsf.edu/chimerax/cgi-bin/upload_build.py
      - name: Upload ChimeraX (Candidate or Production)
        if: ${{ inputs.release_type == 'candidate' || inputs.release_type == 'production' }}
        uses: nick-fields/retry@v4
        with:
          max_attempts: 1000
          timeout_minutes: 60
          shell: bash
          command: curl -v -F "key=${{ secrets.PREBUILT_CACHE_SECRET }}" -F "commit=$COMMIT_HASH" -F "version=$BUILD_VERSION" -F "date=$COMMIT_DATE" -F "platform=windows" -F "build_type=${{ inputs.release_type }}" -F "file=@$GITHUB_WORKSPACE/ChimeraX.tar.gz" https://rbvi.ucsf.edu/chimerax/cgi-bin/upload_build.py
