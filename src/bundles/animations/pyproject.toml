[build-system]
requires = ["setuptools", "ChimeraX-BundleBuilder"]
build-backend = "chimerax.bundle_builder.cx_pep517"

[project]
name = "ChimeraX-Animations"
license = { text = "Free for non-commercial use" }
authors= [{name = "UCSF RBVI", email="chimerax@cgl.ucsf.edu"}]
description = "Create, play back, edit, and save animation timelines."
dependencies = [
	"ChimeraX-Core ~=1.0"
	, "ChimeraX-UI ~=1.0"
	, "ChimeraX-Movie ~=1.0"
	, "ChimeraX-Scenes ~=0.1"
]

# TODO:
# [project.optional-dependencies]
# ui = ["ChimeraX-UI ~= 1.0", "ChimeraX-Help ~= 1.0"]
# alignments = ["ChimeraX-Alignments ~= 2.0"]
# alphafold = ["ChimeraX-AlphaFold ~= 1.0"]

dynamic = ["classifiers", "requires-python", "version"]

[project.readme]
content-type = "text"
text = """The Animations bundle offers comprehensive tools for creating, modifying, and capturing animations
within the ChimeraX application. It enables users to build a keyframe animation, manage timelines, preview frames,
and record animations to files, enhancing the dynamic visualization capabilities of ChimeraX."""

[project.urls]
Home = "https://www.rbvi.ucsf.edu/chimerax/"

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.chimerax]
min-session-version = 1
max-session-version = 1
custom-init = true
categories = ["General"]
classifiers = ["Development Status :: 2 - Pre-Alpha"]

[tool.chimerax.command."animations timeline"]
category = "General"
description = "List all keyframes or scenes in the animation."

[tool.chimerax.command."animations play"]
category = "General"
description = "Play the animation."

[tool.chimerax.command."animations stop"]
category = "General"
description = "Stop the animation."

[tool.chimerax.command."animations preview"]
category = "General"
description = "Preview animation at a specific time."

[tool.chimerax.command."animations setLength"]
category = "General"
description = "Set animation length."

[tool.chimerax.command."animations record"]
category = "General"
description = "Record the animation to a movie file."

[tool.chimerax.command."animations stopRecording"]
category = "General"
description = "Stop recording the animation."

[tool.chimerax.command."animations clear"]
category = "General"
description = "Clear all keyframes or scenes from the animation."

[tool.chimerax.tool."Animations"]
category = "Depiction"
description = "Create, play back, edit, and save animation timelines."
